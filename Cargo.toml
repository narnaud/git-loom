[package]
name = "git-loom"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
default-run = "git-loom"
description = "A Git CLI tool that weaves together multiple feature branches into integration branches"
license = "MIT"
repository = "https://github.com/narnaud/git-loom"
homepage = "https://narnaud.github.io/git-loom"
readme = "README.md"
keywords = [ "git", "cli", "branches", "workflow" ]
categories = [ "command-line-utilities", "development-tools" ]
exclude = [ ".claude/", ".github/", "docs/demo/", "docs/src/assets/*.mp4" ]

[lib]
# The doc comments draw graphs and command lines: none is Rust to compile.
doctest = false

[[bin]]
name = "git-loom"
path = "src/bin/git-loom.rs"
# Its code and its tests are the library's.
test = false
doc = false

[[bin]]
name = "git-loom-gui"
path = "src/bin/git-loom-gui.rs"
required-features = [ "gui" ]
test = false
doc = false

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = [ "derive" ] }
colored = "3"
inquire = "0.9"
# ssh/https were default features until git2 0.21; keep them so vendored-openssl stays functional
git2 = { version = "0.21", features = [ "ssh", "https" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "raw_value" ] }
shell-escape = "0.1"
tempfile = "3"
ratatui = "0.30.0"
crossterm = "0.29.0"
terminal-colorsaurus = "1"
terminal_size = "0.4"
# Slint 1.19 needs Rust 1.95, above `rust-version`: only `--features gui`
# builds it, so the CLI keeps its own minimum.
slint = { version = "1.19", optional = true }

[build-dependencies]
slint-build = { version = "1.19", optional = true }

[profile.release]
lto = true
strip = true

[features]
vendored-openssl = [ "git2/vendored-openssl" ]
# The window and its executable, `git-loom-gui`: off by default, so that a
# plain build needs no GUI toolchain.
gui = [ "dep:slint", "dep:slint-build" ]

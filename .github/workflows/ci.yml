name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -Dwarnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # As the release build does: libssh2 links Homebrew's OpenSSL.
      - if: runner.os == 'macOS'
        run: |
          brew install --quiet openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
      # No `cargo build` first, on purpose: `cargo test` has to produce
      # target/<profile>/git-loom by itself, which is what tests/bin_is_built.rs
      # is for. Building here would hide its removal.
      - run: cargo test --locked
      # The completion tests skip the shells that are missing. Linux only:
      # test_show runs util-linux's `script -c`, which BSD `script` lacks.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - if: runner.os == 'Linux'
        run: bash test-integration.sh

  msrv:
    name: Check (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cargo.toml's `rust-version`: a dependency update needing a newer
      # compiler fails here instead of in a user's `cargo install`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo check --locked --all-targets

  oldest-git:
    name: Test (oldest git)
    runs-on: ubuntu-latest
    # Ubuntu 24.04's own git is the minimum loom accepts (MIN_GIT_VERSION);
    # the runners carry a recent one. git goes in before checkout, which
    # otherwise downloads a tarball instead of cloning.
    container: ubuntu:24.04
    steps:
      - run: >
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
          git ca-certificates curl build-essential pkg-config libssl-dev zsh fish
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: git --version
      - run: cargo test --locked
      - run: bash test-integration.sh

  hostile-config:
    name: Test (hostile gitconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # git-loom shells out to git constantly, so a user's gitconfig can change
      # what it reads back. These steps are the suite again, this time with
      # a global config built to break it — see tests/hostile.gitconfig. It is
      # installed as ~/.gitconfig, after `checkout`, because the repositories
      # loom opens through libgit2 ignore `GIT_CONFIG_GLOBAL`.
      - run: cp tests/hostile.gitconfig ~/.gitconfig
      - run: cargo test --locked
      - run: bash test-integration.sh

name: Release Please
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Credit commit authors in the release notes
        if: ${{ steps.release.outputs.release_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          previous=$(gh api "repos/$REPO/releases?per_page=10" \
            --jq 'map(select(.draft | not)) | map(select(.tag_name != env.TAG)) | .[0].tag_name // empty')
          if [ -z "$previous" ]; then
            echo "No previous release to compare against, skipping."
            exit 0
          fi
          gh api --paginate "repos/$REPO/compare/$previous...$TAG" \
            --jq '.commits[]
                  | [.sha, (if .author.login then "@" + .author.login else .commit.author.name end)]
                  | @tsv' > authors.tsv
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > notes.md
          awk -F'\t' '
            NR == FNR { author[$1] = $2; next }
            {
              if (match($0, /\/commit\/[0-9a-f]+\)\)$/)) {
                sha = substr($0, RSTART + 8, RLENGTH - 10)
                if (sha in author) $0 = $0 " by " author[sha]
              }
              print
            }' authors.tsv notes.md > credited.md
          gh release edit "$TAG" --repo "$REPO" --notes-file credited.md
